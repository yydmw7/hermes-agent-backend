app:
  name: Hermes Agent
  host: 127.0.0.1
  port: 8787

hermes:
  root: /home/ubuntu/hermes
  healthUrl: http://127.0.0.1:3000/health
  logFile: /home/ubuntu/hermes/logs/app.log
  logCommand: ""
  service:
    name: ""
    scope: ""
  commands:
    start: ""
    stop: ""
    restart: ""
    status: ""

backup:
  dir: /mnt/d/HermesBackups
  keepLast: 10
  include:
    - .env
    - config
    - data
    - uploads
    - logs
  exclude:
    - node_modules
    - .git
    - cache
    - tmp

security:
  adminToken: ""
